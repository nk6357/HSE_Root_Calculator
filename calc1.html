<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Root Calculator</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

<header class="siteheader">
    <nav class="glavcalc">
        <a href="./index1.html">Home</a>
        <a href="./calc1.html">Calculator</a>
    </nav>
</header>

<div class="calculator">

    <h1>HSE Root Calculator</h1>

    <div class="name-output">
        Before entering data, review the
        <a href="./index1.html#input-rules">input rules.</a>
    </div>

    <div class="subtitle">
        Enter the radicand
    </div>

    <div class="root">
        <span class="root-number">2</span>
        <span class="root-symbol">√</span>
        <input id="inroot" type="text" class="root-input">
    </div>

    <div class="parameters">

        <div class="parameter accuracy">
            <div class="parameter-title">
                Number of decimal places
            </div>
            <div class="accuracy-input">
                <input id="accuracy" type="number" min="0" max="512" value="0">
            </div>
        </div>

    </div>

    <button type="button" id="Calculate">Calculate</button>

    <div class="name-output">
        Root result:
    </div>

    <output id="numeric-result" class="result"></output>

    <div class="name-output">
        Root result in analytical form:
    </div>

    <output id="analytic-result" class="result2"></output>
</div>
<script src="script.js"></script>
</body>
