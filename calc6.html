<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الجذور التربيعية HSE</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

<header class="siteheader">
    <nav class="glavcalc">
        <a href="./index6.html">الرئيسية</a>
        <a href="./calc6.html">الحاسبة</a>
    </nav>
</header>

<div class="calculator">

    <h1>حاسبة الجذور التربيعية HSE</h1>

    <div class="name-output">
        قبل إدخال البيانات، اطّلع على
        <a href="./index6.html#input-rules">قواعد الإدخال.</a>
    </div>

    <div class="subtitle">
        أدخل العدد تحت الجذر
    </div>

    <div class="root">
        <span class="root-number">2</span>
        <span class="root-symbol">√</span>
        <input id="inroot" type="text" class="root-input">
    </div>

    <div class="parameters">

        <div class="parameter accuracy">
            <div class="parameter-title">
                عدد الأرقام بعد الفاصلة العشرية
            </div>
            <div class="accuracy-input">
                <input id="accuracy" type="number" min="0" max="512" value="0">
            </div>
        </div>

    </div>

    <button type="button" id="Calculate">احسب</button>

    <div class="name-output">
        ناتج الجذر:
    </div>

    <output id="numeric-result" class="result"></output>

    <div class="name-output">
        ناتج الجذر بالصيغة التحليلية:
    </div>

    <output id="analytic-result" class="result2"></output>
</div>
<script src="script.js"></script>
</body>
