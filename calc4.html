<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de raíces cuadradas HSE</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

<header class="siteheader">
    <nav class="glavcalc">
        <a href="./index4.html">Inicio</a>
        <a href="./calc4.html">Calculadora</a>
    </nav>
</header>

<div class="calculator">

    <h1>Calculadora de raíces cuadradas HSE</h1>

    <div class="name-output">
        Antes de introducir datos, consulta las
        <a href="./index4.html#input-rules">reglas de introducción.</a>
    </div>

    <div class="subtitle">
        Introduce el radicando
    </div>

    <div class="root">
        <span class="root-number">2</span>
        <span class="root-symbol">√</span>
        <input id="inroot" type="text" class="root-input">
    </div>

    <div class="parameters">

        <div class="parameter accuracy">
            <div class="parameter-title">
                Número de decimales
            </div>
            <div class="accuracy-input">
                <input id="accuracy" type="number" min="0" max="512" value="0">
            </div>
        </div>

    </div>

    <button type="button" id="Calculate">Calcular</button>

    <div class="name-output">
        Resultado de la raíz:
    </div>

    <output id="numeric-result" class="result"></output>

    <div class="name-output">
        Resultado de la raíz en forma analítica:
    </div>

    <output id="analytic-result" class="result2"></output>
</div>
<script src="script.js"></script>
</body>
