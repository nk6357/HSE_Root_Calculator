<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE مربع جذر کیلکولیٹر</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

<header class="siteheader">
    <nav class="glavcalc">
        <a href="./index10.html">مرکزی صفحہ</a>
        <a href="./calc10.html">کیلکولیٹر</a>
    </nav>
</header>

<div class="calculator">

    <h1>HSE مربع جذر کیلکولیٹر</h1>

    <div class="name-output">
        ڈیٹا درج کرنے سے پہلے
        <a href="./index10.html#input-rules">ان پٹ کے اصول پڑھیں۔</a>
    </div>

    <div class="subtitle">
        جذر کے اندر موجود عدد درج کریں
    </div>

    <div class="root">
        <span class="root-number">2</span>
        <span class="root-symbol">√</span>
        <input id="inroot" type="text" class="root-input">
    </div>

    <div class="parameters">

        <div class="parameter accuracy">
            <div class="parameter-title">
                اعشاریہ کے بعد ہندسوں کی تعداد
            </div>
            <div class="accuracy-input">
                <input id="accuracy" type="number" min="0" max="512" value="0">
            </div>
        </div>

    </div>

    <button type="button" id="Calculate">حساب کریں</button>

    <div class="name-output">
        جذر کا نتیجہ:
    </div>

    <output id="numeric-result" class="result"></output>

    <div class="name-output">
        جذر کا تحلیلی نتیجہ:
    </div>

    <output id="analytic-result" class="result2"></output>
</div>
<script src="script.js"></script>
</body>
